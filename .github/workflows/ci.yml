name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build MarkdownEditor.slnx -c Release
      - run: dotnet test --solution MarkdownEditor.slnx -c Release --no-build
