name: Release
# Pushing a version tag (v1.2.0, or v1.2.0-beta.1 for a pre-release) builds the installer,
# signs it with the self-signed certificate (once the CODE_SIGNING_* secrets are set, see README > Code signing)
# and publishes it, with the public certificate, as GitHub Release assets.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not a version tag (expected v<major>.<minor>.<patch>[-<prerelease>])."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($tag.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - run: dotnet build MarkdownEditor.slnx -c Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test --solution MarkdownEditor.slnx -c Release --no-build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and sign installer
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $buildArgs = @{ Version = '${{ steps.version.outputs.version }}' }
          if ($env:CODE_SIGNING_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64))
            $buildArgs.CertificatePath = $pfx
          } else {
            Write-Host '::warning::CODE_SIGNING_PFX_BASE64 is not set; publishing an unsigned installer.'
          }
          try { ./installer/build.ps1 @buildArgs }
          finally { if ($buildArgs.CertificatePath) { Remove-Item $buildArgs.CertificatePath } }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem artifacts/installer -File -Include *.exe, *.cer -Recurse).FullName
          $releaseArgs = @('${{ github.ref_name }}') + $assets + @('--title', 'Markdown Editor ${{ steps.version.outputs.version }}', '--generate-notes')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $releaseArgs += '--prerelease' }
          gh release create @releaseArgs
